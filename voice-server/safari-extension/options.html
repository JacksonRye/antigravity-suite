<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Butler Settings</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #111827;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f9fafb;
      --muted: #9ca3af;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --emerald: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .settings-container {
      width: 100%;
      max-width: 580px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .logo-orb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      box-shadow: 0 0 12px #6366f1;
    }
    h1 { font-size: 20px; font-weight: 600; }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }
    .help-text {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.4;
    }
    input[type="text"], textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: white;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: var(--primary);
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      cursor: pointer;
    }
    .checkbox-row input {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
    }
    .checkbox-label {
      font-size: 13px;
      color: var(--text);
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .toast {
      color: var(--emerald);
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="settings-container">
    <div class="header">
      <div class="logo-orb"></div>
      <h1>Antigravity Voice Butler Settings</h1>
    </div>

    <form id="settingsForm">
      <div class="form-group">
        <label for="serverUrl">Gemini Live WebSocket Relay URL</label>
        <input type="text" id="serverUrl" placeholder="ws://localhost:8000/ws" required>
        <div class="help-text">
          Enter the WebSocket URL of your Gemini Live Voice server (e.g. <code>ws://localhost:8000/ws</code> or <code>wss://your-vps-ip:8000/ws</code>).
        </div>
      </div>

      <div class="form-group">
        <label for="whitelistedHosts">Target Domains / Hosts</label>
        <textarea id="whitelistedHosts" rows="3" placeholder="localhost&#10;127.0.0.1&#10;antigravity.google"></textarea>
        <div class="help-text">
          Enter domain names or IP addresses where the in-page Voice Orb should appear (one per line). Use <code>*</code> to enable on all web pages.
        </div>
      </div>

      <div class="form-group">
        <label class="checkbox-row">
          <input type="checkbox" id="orbVisible">
          <span class="checkbox-label">Display floating Voice Orb on active tabs</span>
        </label>

        <label class="checkbox-row">
          <input type="checkbox" id="autoConnect">
          <span class="checkbox-label">Auto-connect Voice Butler when Antigravity page loads</span>
        </label>

        <label class="checkbox-row">
          <input type="checkbox" id="handsFree">
          <span class="checkbox-label">Enable continuous Hands-Free VAD by default</span>
        </label>
      </div>

      <div class="actions">
        <span class="toast" id="toast">Settings saved!</span>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save Settings</button>
      </div>
    </form>
  </div>

  <script src="options.js"></script>
</body>
</html>
